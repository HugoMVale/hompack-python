[project]
name = "hompack"
dynamic = ["version"]
description = "Package for finding zeros or fixed points of nonlinear systems."
requires-python = ">= 3.12"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Hugo Vale", email = "57530119+HugoMVale@users.noreply.github.com" },
]
keywords = ["mathematics"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
]

dependencies = ['numpy>=1.26']

[project.urls]
Repository = "https://github.com/HugoMVale/hompack-python"
Documentation = "https://hugomvale.github.io/hompack-python/"

[dependency-groups]
dev = [
    "meson-python>=0.18.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "build>=1.5.0",
    "ruff>=0.17.1",
    "pyrefly>=1.4.0",
    "ninja>=1.13.2",
]
docs = [
    "mkdocs-material>=9.6.18",
    "mkdocstrings-python>=1.18.0",
    "mkdocs-jupyter>=0.25.1",
    "black>=25.1.0",
    "matplotlib>=3.10.0",
    "ipykernel>=6.30.1",
]

[build-system]
build-backend = "mesonpy"
requires = ["meson-python>=0.18.0"]

[tool.pytest.ini_options]
norecursedirs = ["subprojects"]
addopts = "-v -s"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "D", "NPY201"]
ignore = ["D100", "D104", "D205", "E502", "F403"]
unfixable = ["F401"]
pydocstyle = { convention = 'numpy' }

[tool.ruff.format]
line-ending = "auto"
