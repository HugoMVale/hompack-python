repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --frozen ruff check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: ruff-format
        name: Ruff format check
        entry: uv run --frozen ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: pyrefly
        name: Pyrefly type check
        entry: uv run --frozen pyrefly check src
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]